name: Push rc to steam
on: workflow_dispatch


jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Get Latest Release Tag
        id: get_tag
        run: |
          TAG=$(gh release list --repo SlimeVR/SlimeVR-Server --limit 1 --json tagName --jq '.[0].tagName')
          echo "LATEST_TAG=$TAG" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Directories  
        run: mkdir -p release/windows64/jre && mkdir -p release/linux64/jre && mkdir -p release/windows64/slimevr_usb_drivers

      - name: Move launch script to linux depot
        run: mv depots/linux64/launch.sh release/linux64/launch.sh

      - name: Move Linux JRE to depot
        run: mv depots/linux64/jre/* release/linux64/jre/

      - name: Move windows usb drivers to depot
        run: mv depots/windows64/slimevr_usb_drivers/* release/windows64/slimevr_usb_drivers/

      - name: Move Window JRE to depot
        run: mv depots/windows64/jre/* release/windows64/jre/

      - name: 'Get windows server'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'SlimeVR/SlimeVR-Server'
          version: 'tags/${{ env.LATEST_TAG }}'
          file: 'SlimeVR-win64.zip'

      - name: 'Unzip windows server' 
        run: mkdir -p release/windows64 && unzip SlimeVR-win64.zip -d release/windows64
      
      - name: 'Get Windows OpenVr Driver'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'SlimeVR/SlimeVR-OpenVR-Driver'
          version: 'latest'
          file: 'slimevr-openvr-driver-win64.zip'

      - name: 'Unzip Windows OpenVR Driver'
        run: |
          unzip slimevr-openvr-driver-win64.zip -d release/windows64/
          mv release/windows64/slimevr release/windows64/slimevr-openvr-driver-win64

      - name: 'Get Linux release'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'SlimeVR/SlimeVR-Server'
          version: 'tags/${{ env.LATEST_TAG }}'
          file: 'SlimeVR-amd64.deb'
        
      - name: 'Unzip linux release'
        run: |
          mkdir -p release/linux64
          ar x SlimeVR-amd64.deb
          tar -xvf data.tar.xz -C ./release/linux64 --strip-components=3 "./opt/SlimeVR"

      - name: 'Get linux OpenVR Driver'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'SlimeVR/SlimeVR-OpenVR-Driver'
          version: 'latest'
          file: 'slimevr-openvr-driver-x64-linux.zip'
      
      - name: 'Unzip linux OpenVR Driver'
        run: |
         unzip slimevr-openvr-driver-x64-linux.zip -d release/linux64/
         mv release/linux64/slimevr release/linux64/slimevr-openvr-driver-x64-linux

      - name: 'Move installscript to windows depot'
        run: mv scripts/Installscript.vdf release/windows64/Installscript.vdf

      - name: 'Move USB installscript to windows depot'
        run: mv scripts/installusbdrivers.bat release/windows64/installusbdrivers.bat

      - name: 'Deploy to steam'
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}          
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}          
          appId: 3245490
          buildDescription: Github workflow release candidate build
          rootPath: .
          depot1Path: release/windows64
          depot1InstallScriptPath: release/windows64
          depot2Path: release/linux64
          releaseBranch: release-candidate
