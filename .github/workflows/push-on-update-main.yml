name: Push release to steam
on: 
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Directories  
        run: mkdir -p release/windows64/jre && mkdir -p release/linux64/jre && mkdir -p release/shared && mkdir -p release/windows64/slimevr_usb_drivers

      - name: Move launch script to linux depot
        run: mv depots/linux64/launch.sh release/linux64/launch.sh

      - name: Move Linux JRE to depot
        run: mv depots/linux64/jre/* release/linux64/jre/

      - name: Move windows usb drivers to depot
        run: mv depots/windows64/slimevr_usb_drivers/* release/windows64/slimevr_usb_drivers/

      - name: Move Window JRE to depot
        run: mv depots/windows64/jre/* release/windows64/jre/

      - name: 'Get windows server'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'SlimeVR/SlimeVR-Server'
          version: 'latest'
          file: 'SlimeVR-win64.zip'

      - name: 'Unzip windows server' 
        run: mkdir -p release/windows64 && unzip SlimeVR-win64.zip -d release/windows64
      
      - name: 'Ge Windows OpenVr Driver'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'SlimeVR/SlimeVR-OpenVR-Driver'
          version: 'latest'
          file: 'slimevr-openvr-driver-win64.zip'

      - name: 'Unzip Windows OpenVR Driver'
        run: mkdir -p release/windows64/slimevr-openvr-driver-win64 && unzip slimevr-openvr-driver-win64.zip -d release/windows64/slimevr-openvr-driver-win64

      - name: 'Get Windows feeder'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'SlimeVR/SlimeVR-Feeder-App'
          version: 'latest'
          file: 'SlimeVR-Feeder-App-win64.zip'

      - name: 'Unzip Windows feeder'
        run: mkdir -p release/windows64/SlimeVR-Feeder-App-win64 && unzip SlimeVR-Feeder-App-win64.zip -d release/windows64/SlimeVR-Feeder-App-win64

      - name: 'Get Linux release'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'SlimeVR/SlimeVR-Server'
          version: 'latest'
          file: 'SlimeVR-amd64.deb'
        
      - name: 'Unzip linux release'
        run: |
          mkdir -p release/linux64
          ar x SlimeVR-amd64.deb
          tar -xvf data.tar.xz -C ./release/linux64 --strip-components=3 "./opt/SlimeVR"

      - name: 'Get linux SteamVR Driver'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'SlimeVR/SlimeVR-OpenVR-Driver'
          version: 'latest'
          file: 'slimevr-openvr-driver-x64-linux.zip'
      
      - name: 'Unzip linux SteamVR Driver'
        run: mkdir -p release/linux64/slimevr-openvr-driver-x64-linux && unzip slimevr-openvr-driver-x64-linux.zip -d release/linux64/slimevr-openvr-driver-x64-linux

      - name: 'Get Linux feeder'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'SlimeVR/SlimeVR-Feeder-App'
          version: 'latest'
          file: 'SlimeVR-Feeder-App-Linux.zip'
      
      - name: 'Unzip Linux feeder'
        run: mkdir -p release/linux64/SlimeVR-Feeder-App-Linux && unzip SlimeVR-Feeder-App-Linux.zip -d release/linux64/SlimeVR-Feeder-App-Linux

      - name: 'Get SlimeVR.jar'
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: 'SlimeVR/SlimeVR-Server'
          version: 'latest'
          file: 'slimevr.jar'

      - name: 'Move slimevr.jar to shared directory'
        run: mv slimevr.jar release/shared/slimevr.jar
      
      - name: 'Move installscript to windows depot'
        run: mv scripts/Installscript.vdf release/windows64/Installscript.vdf

      - name: 'Move USB installscript to windows depot'
        run: mv scripts/installusbdrivers.bat release/windows64/installusbdrivers.bat

      - name: 'Deploy to steam'
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}          
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}          
          appId: 3245490
          buildDescription: Github workflow build
          rootPath: .
          depot1Path: release/windows64
          depot1InstallScriptPath: release/windows64
          depot2Path: release/linux64
          depot4Path: release/shared
          releaseBranch: actions
